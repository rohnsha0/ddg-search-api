services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_lead_management
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - fastapi_network
    # Add shared memory size for Chrome (prevents crashes)
    shm_size: '2gb'

networks:
  fastapi_network:
    driver: bridge